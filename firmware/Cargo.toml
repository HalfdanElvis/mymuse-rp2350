[package]
edition = "2024"
name = "firmware"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-sdmmc = "0.10.0"
embedded-hal-bus = "0.3.0" # For SPI bus sharing if needed later
embedded-hal = { version = "1.0.0" }

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

mymuse-core = { path = "../crates/mymuse-core" }
mymuse-hal = { path = "../crates/mymuse-hal" }

embedded-alloc = "0.7"

# We're using a Pico 2 by default on this template
#rp-pico2 = "0.9" # TODO: Do we have that crate already ?

# If you're not going to use a Board Support Package you'll need these:
rp235x-hal = { version = "0.3", features = [
    "rt",
    "critical-section-impl",
    "binary-info",
] }



